name: Contribution validation
on:
  push:
    branches: [validation/contribution-tests-20261021]
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1010dac5fc074e092f072c9505f0989d47898586
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Install Weaver
        run: |
          . tools/runner/src/opentelemetry/conformance/versions.env
          curl -fsSL "https://github.com/open-telemetry/weaver/releases/download/$WEAVER_VERSION/weaver-x86_64-unknown-linux-gnu.tar.xz" | sudo tar -xJ -C /usr/local/bin --strip-components=1 --wildcards '*/weaver'
          weaver --version
      - name: Install coverage test dependencies
        run: |
          python -m pip install pytest ruff opentelemetry-exporter-otlp-proto-grpc
          python -m pip install -e tools/runner -e tools/database/runner -e tools/gen-ai/mock-server -e tools/gen-ai/runner -e tools/http/test-client/python -e tools/http/mock-server -e tools/http/runner
      - name: Resolve models before tests to prevent silent skips
        run: |
          python -c 'from database_conformance import DOMAIN; DOMAIN.coverage_model'
          python -c 'from genai_conformance import DOMAIN; DOMAIN.coverage_model'
          python -c 'from http_conformance import DOMAIN; DOMAIN.coverage_model'
      - name: Test coverage models and Weaver lifecycle
        run: python -m pytest -ra tools/runner/tests/test_weaver.py tools/database/runner/tests tools/gen-ai/runner/tests tools/http/runner/tests
      - name: Lint changed Python
        run: python -m ruff check tools/http/runner/tests/test_http_model.py
  generator:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            environment: py310-test-instrumentation-genai-anthropic-oldest
          - python: "3.14"
            environment: py314-test-instrumentation-genai-anthropic-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Utkarsh-Sinha0/opentelemetry-python-genai
          ref: 85d7ee4bbfbf51820d799e264aa687eec79dc20f
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Install tools
        run: python -m pip install tox tox-uv uv ruff
      - name: Unit tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Ruff check and format
        run: |
          python -m ruff check scripts/generate_requirements.py scripts/tests/test_generate_requirements.py
          python -m ruff format --check scripts/generate_requirements.py scripts/tests/test_generate_requirements.py
      - name: Generate real pinned requirements
        env:
          TOX_ENV: ${{ matrix.environment }}
        run: |
          python scripts/generate_requirements.py "$TOX_ENV" --output "$RUNNER_TEMP/requirements.txt"
          test -s "$RUNNER_TEMP/requirements.txt"
          cat "$RUNNER_TEMP/requirements.txt"
